<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administración — Agrovet.Care.Go</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  .admin-card { background: var(--white); border: 2px solid var(--line); border-radius: 22px; padding: 44px 38px; max-width: 560px; margin: 40px auto; }
  .admin-card h2 { font-size: 2rem; margin-bottom: 8px; text-align: center; }
  .admin-card p.sub { text-align: center; color: var(--ink-soft); margin-bottom: 26px; }
  .admin-card input, .admin-card select, .admin-card textarea {
    width: 100%; padding: 13px 16px; margin-bottom: 14px; border: 1px solid var(--line);
    border-radius: 12px; font-family: inherit; font-size: 1rem; background: var(--parchment); color: var(--ink);
  }
  .admin-card textarea { min-height: 80px; resize: vertical; }
  .admin-card .btn { width: 100%; margin-top: 6px; }
  #login-error { color: #b3261e; text-align: center; min-height: 1.4em; }
  #up-msg { text-align: center; min-height: 1.4em; color: var(--green-dark); }
  #preview { display: none; width: 100%; max-height: 260px; object-fit: cover; border-radius: 14px; margin-bottom: 14px; border: 1px solid var(--line); }
  #mis-fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin: 18px 0; }
  .mi-foto { position: relative; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .mi-foto img { width: 100%; height: 110px; object-fit: cover; display: block; }
  .mi-foto button {
    position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; border-radius: 50%;
    border: none; background: rgba(179,38,30,.9); color: #fff; font-size: 1rem; cursor: pointer;
  }
  .btn-secundario { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); display: inline-block; padding: 10px 26px; border-radius: 40px; cursor: pointer; font-size: .9rem; }
  .alerta-config { background: #fff8e1; border: 1px solid #e0c36a; border-radius: 12px; padding: 16px 20px; max-width: 560px; margin: 30px auto; color: #6d4c00; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="brand" href="index.html">
      <img src="logo.png" alt="Agrovet.Care.Go">
      <span><span class="brand-name">Agrovet.Care.Go</span><br><span class="brand-sub">Administración</span></span>
    </a>
    <a class="volver" href="index.html">← Volver al inicio</a>
  </div>
</header>

<main class="wrap">
  <div id="alerta" class="alerta-config" style="display:none">
    ⚠️ Falta configurar Firebase: abre <strong>firebase-config.js</strong> y pega los datos de tu proyecto (ver README_FIREBASE.md).
  </div>

  <div id="login-box" class="admin-card">
    <h2>Iniciar sesión</h2>
    <p class="sub">Acceso del equipo veterinario</p>
    <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="pass" placeholder="Contraseña" autocomplete="current-password">
    <button class="btn" id="btn-login">Entrar</button>
    <p id="login-error"></p>
  </div>

  <div id="panel" class="admin-card" style="display:none">
    <h2>Subir foto de animal</h2>
    <p class="sub">La foto aparecerá en la galería de la página</p>
    <input type="file" id="file" accept="image/*">
    <img id="preview" alt="Vista previa">
    <input type="text" id="nombre" placeholder="Nombre del animal *" maxlength="60">
    <select id="categoria">
      <option value="ave">Ave</option>
      <option value="exotico">Animal exótico</option>
      <option value="ganado">Ganado</option>
    </select>
    <textarea id="descripcion" placeholder="Descripción (opcional)" maxlength="300"></textarea>
    <button class="btn" id="btn-subir">📤 Subir foto</button>
    <p id="up-msg"></p>
    <h2 style="margin-top:30px">Mis fotos</h2>
    <div id="mis-fotos"></div>
    <p style="text-align:center"><button class="btn-secundario" id="btn-salir">Cerrar sesión</button></p>
  </div>
</main>

<script>
(function () {
  if (!FIREBASE_LISTO) {
    document.getElementById("alerta").style.display = "block";
    document.getElementById("login-box").style.display = "none";
    return;
  }
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var storage = firebase.storage();

  var loginBox = document.getElementById("login-box");
  var panel = document.getElementById("panel");
  var loginError = document.getElementById("login-error");

  document.getElementById("btn-login").addEventListener("click", function () {
    loginError.textContent = "";
    var email = document.getElementById("email").value.trim();
    var pass = document.getElementById("pass").value;
    auth.signInWithEmailAndPassword(email, pass).catch(function (e) {
      loginError.textContent = "No se pudo entrar. Revisa el correo y la contraseña.";
    });
  });

  document.getElementById("btn-salir").addEventListener("click", function () {
    auth.signOut();
  });

  auth.onAuthStateChanged(function (user) {
    loginBox.style.display = user ? "none" : "block";
    panel.style.display = user ? "block" : "none";
    if (user) cargarFotos();
  });

  var fileInput = document.getElementById("file");
  var preview = document.getElementById("preview");
  fileInput.addEventListener("change", function () {
    var f = fileInput.files[0];
    if (f) { preview.src = URL.createObjectURL(f); preview.style.display = "block"; }
    else { preview.style.display = "none"; }
  });

  document.getElementById("btn-subir").addEventListener("click", function () {
    var msg = document.getElementById("up-msg");
    var f = fileInput.files[0];
    var nombre = document.getElementById("nombre").value.trim();
    var categoria = document.getElementById("categoria").value;
    var descripcion = document.getElementById("descripcion").value.trim();
    if (!f) { msg.textContent = "Elige una foto primero."; return; }
    if (!nombre) { msg.textContent = "Ponle un nombre al animal."; return; }
    msg.textContent = "Subiendo…";
    var path = "fotos/" + Date.now() + "_" + f.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    storage.ref(path).put(f).then(function (snap) {
      return snap.ref.getDownloadURL().then(function (url) {
        return db.collection("fotos").add({
          nombre: nombre, categoria: categoria, descripcion: descripcion,
          url: url, path: path,
          fecha: firebase.firestore.FieldValue.serverTimestamp()
        });
      });
    }).then(function () {
      msg.textContent = "✅ Foto publicada en la galería.";
      fileInput.value = ""; preview.style.display = "none";
      document.getElementById("nombre").value = "";
      document.getElementById("descripcion").value = "";
      cargarFotos();
    }).catch(function () {
      msg.textContent = "❌ Error al subir. Intenta de nuevo.";
    });
  });

  function cargarFotos() {
    var box = document.getElementById("mis-fotos");
    db.collection("fotos").orderBy("fecha", "desc").limit(30).get().then(function (snap) {
      box.innerHTML = "";
      snap.forEach(function (doc) {
        var f = doc.data();
        var div = document.createElement("div");
        div.className = "mi-foto";
        div.innerHTML = '<img src="' + f.url + '" alt=""><button title="Eliminar">×</button>';
        div.querySelector("button").addEventListener("click", function () {
          if (!confirm("¿Eliminar esta foto?")) return;
          db.collection("fotos").doc(doc.id).delete().then(function () {
            if (f.path) storage.ref(f.path).delete().catch(function(){});
            cargarFotos();
          });
        });
        box.appendChild(div);
      });
      if (!box.innerHTML) box.innerHTML = "<p>Aún no has subido fotos.</p>";
    });
  }
})();
</script>

</body>
</html>
